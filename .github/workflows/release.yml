name: Build & Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-xinerama0 libxcb-cursor0 libxkbcommon-x11-0 libgl1

      - name: Install Python dependencies
        run: |
          pip install pyqt5 python-xlib numpy pyinstaller

      - name: Build Linux binary
        run: |
          pyinstaller --onefile --noconsole \
            --name Papillon-Linux \
            --hidden-import PyQt5.sip \
            --hidden-import papillon_engine \
            papillon.py

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Papillon-Linux

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install pyqt5 numpy pyinstaller

      - name: Build Windows exe
        run: |
          pyinstaller --onefile --noconsole `
            --name Papillon-Windows `
            --hidden-import PyQt5.sip `
            --hidden-import papillon_engine `
            papillon_win.py

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Papillon-Windows.exe

  build-macos:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install pyqt5 numpy pyinstaller pyobjc-framework-Quartz

      - name: Build macOS app
        run: |
          pyinstaller --onefile --noconsole \
            --name Papillon-macOS \
            --hidden-import PyQt5.sip \
            --hidden-import papillon_engine \
            papillon_mac.py

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Papillon-macOS
