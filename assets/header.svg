<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f4f8"/>
      <stop offset="100%" style="stop-color:#d4eaf0"/>
    </linearGradient>
    <linearGradient id="wing1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e18a32"/>
      <stop offset="100%" style="stop-color:#d4793c"/>
    </linearGradient>
    <linearGradient id="wing2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5b8ec9"/>
      <stop offset="100%" style="stop-color:#4477b8"/>
    </linearGradient>
    <linearGradient id="wing3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1890d0"/>
      <stop offset="100%" style="stop-color:#0f70a8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="200" fill="url(#sky)" rx="12"/>

  <!-- Left butterfly (Monarch) -->
  <g transform="translate(140,90) rotate(-15)">
    <ellipse cx="-20" cy="0" rx="22" ry="14" fill="url(#wing1)" opacity="0.9"/>
    <ellipse cx="20" cy="0" rx="22" ry="14" fill="url(#wing1)" opacity="0.9"/>
    <ellipse cx="-16" cy="12" rx="16" ry="10" fill="#d4793c" opacity="0.85"/>
    <ellipse cx="16" cy="12" rx="16" ry="10" fill="#d4793c" opacity="0.85"/>
    <ellipse cx="0" cy="5" rx="3" ry="12" fill="#2a1f0e"/>
    <line x1="-4" y1="-7" x2="-12" y2="-18" stroke="#2a1f0e" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="4" y1="-7" x2="12" y2="-18" stroke="#2a1f0e" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="-12" cy="-18" r="1.5" fill="#2a1f0e"/>
    <circle cx="12" cy="-18" r="1.5" fill="#2a1f0e"/>
  </g>

  <!-- Title -->
  <text x="400" y="85" text-anchor="middle" font-family="Georgia, serif" font-size="52" font-weight="bold" fill="#2c5530" letter-spacing="4">Papillon</text>
  <text x="400" y="115" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#5a8a5e" letter-spacing="6">DESKTOP BUTTERFLY GARDEN</text>

  <!-- Right butterfly (Morpho) -->
  <g transform="translate(660,85) rotate(12)">
    <ellipse cx="-18" cy="0" rx="20" ry="13" fill="url(#wing3)" opacity="0.9"/>
    <ellipse cx="18" cy="0" rx="20" ry="13" fill="url(#wing3)" opacity="0.9"/>
    <ellipse cx="-14" cy="10" rx="14" ry="9" fill="#1078b8" opacity="0.85"/>
    <ellipse cx="14" cy="10" rx="14" ry="9" fill="#1078b8" opacity="0.85"/>
    <ellipse cx="0" cy="4" rx="2.5" ry="10" fill="#1a1a2e"/>
    <line x1="-3" y1="-6" x2="-10" y2="-16" stroke="#1a1a2e" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="3" y1="-6" x2="10" y2="-16" stroke="#1a1a2e" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="-10" cy="-16" r="1.5" fill="#1a1a2e"/>
    <circle cx="10" cy="-16" r="1.5" fill="#1a1a2e"/>
  </g>

  <!-- Small blue butterfly top-left -->
  <g transform="translate(80,45) rotate(-25) scale(0.5)">
    <ellipse cx="-14" cy="0" rx="16" ry="10" fill="url(#wing2)" opacity="0.8"/>
    <ellipse cx="14" cy="0" rx="16" ry="10" fill="url(#wing2)" opacity="0.8"/>
    <ellipse cx="0" cy="3" rx="2" ry="8" fill="#1a1a3e"/>
  </g>

  <!-- Small orange butterfly bottom-right -->
  <g transform="translate(720,150) rotate(20) scale(0.4)">
    <ellipse cx="-14" cy="0" rx="16" ry="10" fill="url(#wing1)" opacity="0.7"/>
    <ellipse cx="14" cy="0" rx="16" ry="10" fill="url(#wing1)" opacity="0.7"/>
    <ellipse cx="0" cy="3" rx="2" ry="8" fill="#2a1f0e"/>
  </g>

  <!-- Decorative dots -->
  <circle cx="50" cy="170" r="3" fill="#d4793c" opacity="0.4"/>
  <circle cx="200" cy="180" r="2.5" fill="#5b8ec9" opacity="0.4"/>
  <circle cx="600" cy="175" r="3" fill="#1890d0" opacity="0.35"/>
  <circle cx="750" cy="185" r="2" fill="#e18a32" opacity="0.4"/>

  <!-- Version badge -->
  <rect x="330" y="135" width="140" height="24" rx="12" fill="#2c5530" opacity="0.15"/>
  <text x="400" y="152" text-anchor="middle" font-family="monospace" font-size="12" fill="#2c5530">v1.0 · 16 species</text>
</svg>
