  <text x="350" y="170" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#5599cc">Windows / Win32</text>

  <rect x="490" y="130" width="170" height="50" rx="8" fill="#cc44cc" opacity="0.12" stroke="#cc44cc" stroke-width="1.2"/>
